name: Nova
options:
  bundleIdPrefix: com.novaapp
  deploymentTarget:
    iOS: "17.0"
packages:
  NovaCore:
    path: NovaCore
targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - path: Nova/Sources
      - path: Nova/Resources/www
        type: folder
        buildPhase: resources
    dependencies:
      - package: NovaCore
        product: NovaCore
      - framework: ../NativeCores/whisper.cpp/build-apple/whisper.xcframework
        embed: true
      - framework: ../NativeCores/llama.cpp/build-apple/llama.xcframework
        embed: true
      - framework: ../NativeCores/open_jtalk/build-apple/openjtalk.xcframework
        embed: true
      - framework: ../NativeCores/onnxruntime/build-apple/onnxruntime.xcframework
        embed: true
      - framework: ../NativeCores/espeak-ng/build-apple/espeak-ng.xcframework
        embed: true
    prebuildScripts:
      - name: Build ui/ frontend
        script: |
          set -e
          npm --prefix "$SRCROOT/../ui" install
          # --base=./ (not the shared vite.config.js, which the desktop Tauri
          # build also uses): Vite's default absolute "/assets/..." paths
          # resolve against the filesystem root when index.html is loaded via
          # file://, not relative to the html file — breaks asset loading in
          # WKWebView specifically.
          npm --prefix "$SRCROOT/../ui" run build -- --base=./
          rm -rf "$SRCROOT/Nova/Resources/www"
          cp -R "$SRCROOT/../ui/dist" "$SRCROOT/Nova/Resources/www"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novaapp.nova
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Nova/Sources/Nova-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        HEADER_SEARCH_PATHS: "../NativeCores/onnxruntime/build-apple/Headers ../NativeCores/espeak-ng/build-apple/Headers"
        # Real distribution signing (TestFlight/App Store), not the
        # Simulator-only "Sign to Run Locally" identity used everywhere else
        # in this repo so far. Deliberately NOT a literal team ID here (this
        # repo is public) — XcodeGen substitutes ${DEVELOPMENT_TEAM} from the
        # shell environment at `xcodegen generate` time. Export it yourself
        # before generating: `export DEVELOPMENT_TEAM=<your team ID>` — see
        # ios/README.md. Automatic signing still needs Xcode signed into an
        # Apple ID with access to that team on the machine that actually
        # archives — that account/credential step can't happen inside an
        # unattended build regardless of where the team ID comes from.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
    info:
      path: Nova/GeneratedInfo.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Nova listens while you hold the talk button so it can hear your practice conversation."
  NovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaTests
    dependencies:
      - target: Nova
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Nova:
    build:
      targets:
        Nova: all
    test:
      targets:
        - NovaTests
