name: Nova
options:
  bundleIdPrefix: cz.macek
  deploymentTarget:
    iOS: "17.0"
packages:
  NovaCore:
    path: NovaCore
targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - path: Nova/Sources
      - path: Nova/Resources/www
        type: folder
        buildPhase: resources
      - path: Nova/Resources/Assets.xcassets
    dependencies:
      - package: NovaCore
        product: NovaCore
      - framework: ../NativeCores/whisper.cpp/build-apple/whisper.xcframework
        embed: true
      - framework: ../NativeCores/llama.cpp/build-apple/llama.xcframework
        embed: true
      # NOT embedded: openjtalk.xcframework's slices are a plain static
      # archive (libopenjtalk.a), not a real framework bundle at all —
      # embedding it (copying it into Frameworks/) is invalid App Store
      # bundle structure ("standalone executables or libraries" aren't
      # permitted there). A static library gets fully linked into Nova's own
      # binary at compile time; there's nothing dynamic to embed.
      - framework: ../NativeCores/open_jtalk/build-apple/openjtalk.xcframework
        embed: false
      # NOT embedded: despite being packaged as a onnxruntime.framework
      # bundle, the actual binary inside is a static archive (`ar archive`,
      # confirmed via `file`), not a real dynamic library — this is how
      # Microsoft ships the official onnxruntime-c CocoaPod. Xcode's build
      # silently papers over this in Debug/Simulator builds by injecting a
      # throwaway stub dynamic binary ("Injecting stub binary into codeless
      # framework"), but that stub has no real MinimumOSVersion/dSYM, which
      # is exactly what App Store validation rejected. Link it statically.
      - framework: ../NativeCores/onnxruntime/build-apple/onnxruntime.xcframework
        embed: false
      - framework: ../NativeCores/espeak-ng/build-apple/espeak-ng.xcframework
        embed: true
    prebuildScripts:
      - name: Build ui/ frontend
        script: |
          set -e
          # Xcode's Run Script phases use a minimal PATH, not the interactive
          # shell's — npm/node installed via nvm, a user-local prefix
          # (~/.local/bin), or Homebrew are invisible here even though a
          # Terminal-run `xcodebuild` finds them fine, which is why this step
          # can fail ("PhaseScriptExecution failed with a nonzero exit code")
          # in Xcode's own build while the exact same project builds cleanly
          # from the command line. Prepend the common install locations.
          export PATH="$HOME/.local/bin:$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | sort -V | tail -1)/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          npm --prefix "$SRCROOT/../ui" install
          # --base=./ (not the shared vite.config.js, which the desktop Tauri
          # build also uses): Vite's default absolute "/assets/..." paths
          # resolve against the filesystem root when index.html is loaded via
          # file://, not relative to the html file — breaks asset loading in
          # WKWebView specifically.
          npm --prefix "$SRCROOT/../ui" run build -- --base=./
          rm -rf "$SRCROOT/Nova/Resources/www"
          cp -R "$SRCROOT/../ui/dist" "$SRCROOT/Nova/Resources/www"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.macek.nova
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Nova/Sources/Nova-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        HEADER_SEARCH_PATHS: "../NativeCores/onnxruntime/build-apple/Headers ../NativeCores/espeak-ng/build-apple/Headers"
        # Not a literal team ID (this is a public repo) — XcodeGen substitutes
        # ${DEVELOPMENT_TEAM} from the shell environment at `xcodegen
        # generate` time. This ONLY works reliably if the var is exported
        # PERMANENTLY in your shell profile (~/.zshrc), not just once in a
        # terminal session — XcodeGen has no fallback-value syntax
        # (${VAR:-default} is passed through completely unsubstituted, not
        # partially), so if it's unset when you run `xcodegen generate`, the
        # literal broken string "${DEVELOPMENT_TEAM}" gets written into the
        # project, which breaks Xcode's own build entirely (not just
        # archiving) — this exact failure mode already happened once and was
        # fixed by removing this key; re-adding it only makes sense paired
        # with the permanent-export habit described in ios/README.md.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Nova/GeneratedInfo.plist
      properties:
        UILaunchScreen: {}
        # Xcode only auto-injects this from ASSETCATALOG_COMPILER_APPICON_NAME
        # when a target uses the newer GENERATE_INFOPLIST_FILE/INFOPLIST_KEY_*
        # flow; this project merges a static Info.plist template instead, so
        # it needs to be listed explicitly or App Store validation rejects
        # the bundle ("Missing Info.plist value... CFBundleIconName").
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Nova listens while you hold the talk button so it can hear your practice conversation."
        # Declares the export-compliance answer up front so App Store Connect
        # stops asking it on every single upload. Accurate as of this
        # writing: the app only uses standard OS-provided HTTPS (URLSession,
        # for on-demand model downloads — see ModelDownloader.swift) and an
        # unencrypted local loopback WebSocket (NovaWebSocketServer.swift) —
        # no custom/proprietary cryptography anywhere. If that ever changes
        # (e.g. a custom encryption scheme is added), this must be revisited;
        # it's a real legal declaration, not just build config.
        ITSAppUsesNonExemptEncryption: false
  NovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaTests
    dependencies:
      - target: Nova
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Nova:
    build:
      targets:
        Nova: all
    test:
      targets:
        - NovaTests
