included:
  - Nova/Sources
  - NovaCore/Sources
  - NovaTests
  - NovaCore/Tests

# Defaults are tuned for larger, more conventionally-styled codebases than
# this one. Disabled rules below are pure style noise for this project (short
# loop/math variable names like `s`/`i`/`h`, and this repo doesn't avoid
# trailing commas) - not correctness signal. Kept enabled: force_try,
# force_cast, and the complexity/length rules, which flag real risk
# (`dispatch`'s cyclomatic complexity, NovaWebSocketServer.swift's size) worth
# tracking even if not fixed immediately.
disabled_rules:
  - identifier_name
  - trailing_comma
  - orphaned_doc_comment

line_length:
  warning: 160
  error: 200

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 500
  error: 800

file_length:
  warning: 1000
  error: 1500

cyclomatic_complexity:
  warning: 15
  error: 35
